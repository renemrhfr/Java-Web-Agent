# Server configuration
server.port=${PORT:8080}
server.shutdown=graceful

# Spring configuration
spring.main.banner-mode=off
spring.ai.replicate.api-token=${REPLICATE_API_TOKEN:}

# Browser configuration
browser.headless=${BROWSER_HEADLESS:true}
browser.timeout-ms=${BROWSER_TIMEOUT_MS:25000}
browser.max-steps=${BROWSER_MAX_STEPS:20}
browser.max-consecutive-failures=${BROWSER_MAX_CONSECUTIVE_FAILURES:8}
browser.low-resource-mode=${BROWSER_LOW_RESOURCE_MODE:true}
browser.cookie-path=${BROWSER_COOKIE_PATH:}
browser.llm.model=${BROWSER_LLM_MODEL:google/gemini-3-flash}

# Browser resource blocking
browser.block-resources.images=${BROWSER_BLOCK_IMAGES:true}
browser.block-resources.fonts=${BROWSER_BLOCK_FONTS:true}
browser.block-resources.media=${BROWSER_BLOCK_MEDIA:true}

# Browser screenshot configuration
browser.screenshot.per-step=${BROWSER_SCREENSHOT_PER_STEP:false}

# Browser snapshot configuration
browser.snapshot.max-chars=${BROWSER_SNAPSHOT_MAX_CHARS:5000}
browser.snapshot.include-details=${BROWSER_SNAPSHOT_INCLUDE_DETAILS:false}
browser.snapshot.filter-visible-only=${BROWSER_SNAPSHOT_FILTER_VISIBLE_ONLY:true}

# Browser executable configuration
browser.executable-path=${BROWSER_EXECUTABLE_PATH:}